services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - atividade5-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  gerador:
    build: ./gerador-mensagens
    container_name: gerador
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - atividade5-net

  consumidor-sentimento:
    build: ./consumidor-sentimento
    container_name: consumidor-sentimento
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - atividade5-net

  consumidor-suporte:
    build: ./consumidor-suporte
    container_name: consumidor-suporte
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - atividade5-net

networks:
  atividade5-net:
    driver: bridge
  